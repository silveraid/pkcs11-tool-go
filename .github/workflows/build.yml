name: Build Binaries

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    # Use a matrix to run the three requested target builds on appropriate runners
    strategy:
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - name: mac-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - name: mac-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # CGO needs to be enabled because pkcs11 uses cgo to interface
          # with the C library!
          CGO_ENABLED: '1'
        run: |
          echo "Building for $GOOS/$GOARCH on runner $RUNNER_OS"
          mkdir -p build
          # Build the main module binary. Adjust output name as needed.
          go build -v -o build/p11tool-new-${GOOS}-${GOARCH} ./

      - name: Generate SHA256 checksum
        run: |
          cd build
          sha256sum p11tool-new-${{ matrix.goos }}-${{ matrix.goarch }} > p11tool-new-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p11tool-new-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            build/p11tool-new-${{ matrix.goos }}-${{ matrix.goarch }}
            build/p11tool-new-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract tag name
          TAG_NAME=${GITHUB_REF#refs/tags/}
          
          # Create release
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --draft=false \
            --prerelease=false \
            --generate-notes
            
          # Upload all artifacts to the release
          find artifacts -type f -name "p11tool-new-*" | while read file; do
            gh release upload "$TAG_NAME" "$file" --clobber
          done