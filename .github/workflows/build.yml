name: Build Binaries

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    # Use a matrix to run the three requested target builds on appropriate runners
    strategy:
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - name: mac-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - name: mac-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # CGO needs to be enabled because pkcs11 uses cgo to interface
          # with the C library!
          CGO_ENABLED: '1'
        run: |
          echo "Building for $GOOS/$GOARCH on runner $RUNNER_OS"
          mkdir -p build
          # Build the main module binary. Adjust output name as needed.
          go build -v -o build/p11tool-new-${GOOS}-${GOARCH} ./

      - name: Generate SHA256 checksum
        run: |
          cd build
          sha256sum p11tool-new-${{ matrix.goos }}-${{ matrix.goarch }} > p11tool-new-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p11tool-new-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            build/p11tool-new-${{ matrix.goos }}-${{ matrix.goarch }}
            build/p11tool-new-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          # Upload each artifact file to the created release via the uploads API
          for file in artifacts/*; do
            [ -f "$file" ] || continue
            fname=$(basename "$file")
            echo "Uploading $fname..."
            curl -sS -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "$UPLOAD_URL?name=$fname"
          done